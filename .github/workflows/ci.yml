name: QQ Mail MCP CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Source and test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqmail-source
          retention-days: 7
          include-hidden-files: true
          path: |
            src/
            test/
            scripts/
            migrations/
            package.json
            package-lock.json
            vitest.config.js
            wrangler.jsonc
            README.md
            dist/
